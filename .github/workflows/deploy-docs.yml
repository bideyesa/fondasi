name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Push docs/ ke branch deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy
          folder: docs
          clean: true
          commit-message: "deploy: docs dari ${{ github.sha }}"
